[package]
name = "email_webview"
version = "0.1.0"
edition = "2021"
description = "Embedded email webview management for Postail"
authors = ["FixeQD"]

[dependencies]
email_network = { path = "../email_network" }
tauri = { version = "2", features = [
    "protocol-asset",
    "tray-icon",
    "unstable",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = [
    "process",
    "signal",
    "user",
    "socket",
    "fs",
    "inotify",
] }
webkit2gtk = { version = "2.0", features = ["v2_32"] }
gtk = { version = "0.18", features = ["v3_24"] }
gdk = "0.18"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
] }
windows_wv = { package = "windows", version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
] }
webview2-com = "0.38"
