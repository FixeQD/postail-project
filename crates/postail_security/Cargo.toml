[package]
name = "postail_security"
version = "0.1.0"
description = "Security primitives for Postail: encryption, key management, TPM"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
keyring = { version = "3", features = ["sync-secret-service", "vendored"] }
zeroize = { version = "1.8", features = ["derive"] }
rand = { version = "0.9", features = ["small_rng"] }
thiserror = "2"
dirs = "6"
hkdf = "0.12"
hex = "0.4"
sha2 = "0.10"
tracing = "0.1"
tiny-bip39 = "2.0.0"
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["process", "signal", "user", "socket", "fs"] }
tss-esapi = { version = "7", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
dunce = "1.0.5"
windows = { version = "0.62", optional = true, features = [
    "Win32_System_TpmBaseServices",
    "Win32_Foundation",
] }
hmac = { version = "0.12", optional = true }

[features]
default = []
tpm = ["tss-esapi", "windows", "hmac"]

[dev-dependencies]
tempfile = "3"
