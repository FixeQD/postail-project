[package]
name = "postail-project"
version = "0.1.0"
description = "Secure Tauri backend for Postail"
authors = ["FixeQD"]
edition = "2021"

[lib]
name = "postail_project_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OAuth
reqwest = { version = "0.13", features = ["json", "form"] }
url = "2"
base64 = "0.22"
sha2 = "0.10"
lazy_static = "1.5"

# Security
aes-gcm = "0.10"
argon2 = "0.5"
keyring = { version = "3", features = ["sync-secret-service", "vendored"] }
zeroize = { version = "1.8", features = ["derive"] }
rand = { version = "0.9", features = ["small_rng"] }
thiserror = "2"
dirs = "6"
hkdf = "0.12"
hex = "0.4"

# Database
rusqlite = { version = "0.38", features = ["bundled-sqlcipher", "unlock_notify"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = "7"

# Async runtime
tokio = { version = "1", features = ["full"] }
portpicker = "0.1.1"
tiny_http = "0.12.0"
async-native-tls = "0.5"
async-std = { version = "1.13", features = ["attributes"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Mail handling
async-imap = "0.11"
lettre = { version = "0.11", features = ["tokio1-native-tls", "smtp-transport"] }
mailparse = "0.16"
css-inline = "0.19"
ammonia = "4"
utf7-imap = "0.3.2"
encoded-words = "0.2" 

# TPM support (Linux)
[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = { version = "7", optional = true }

# TPM support (Windows)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security_Tpm",
    "Win32_Security_Cryptography",
    "Win32_Foundation",
], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["tpm"]
tpm = ["tss-esapi", "windows"]
