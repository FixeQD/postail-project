[package]
name = "postail"
version = "0.1.0"
description = "Secure Tauri backend for Postail"
authors = ["FixeQD"]
edition = "2021"

[lib]
name = "postail_project_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OAuth
reqwest = { version = "0.13", features = ["json", "form"] }
url = "2"
base64 = "0.22"
sha2 = "0.10"
lazy_static = "1.5"
indexmap = { version = "2", features = ["serde"] }

# Security
tss-esapi = { version = "7", optional = true }
aes-gcm = "0.10"
argon2 = "0.5"
keyring = { version = "3", features = ["sync-secret-service", "vendored"] }
zeroize = { version = "1.8", features = ["derive"] }
rand = { version = "0.9", features = ["small_rng"] }
thiserror = "2"
dirs = "6"
hkdf = "0.12"
hex = "0.4"

# Database
rusqlite = { version = "0.38", features = ["bundled-sqlcipher", "unlock_notify", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = "7"

# Async runtime
tokio = { version = "1", features = ["full"] }
portpicker = "0.1.1"
tiny_http = "0.12.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Mail handling
async-imap = "0.11"
stop-token = "0.7"
mailparse = "0.16"
css-inline = "0.19"
ammonia = "4"
utf7-imap = "0.3.2"
maplit = "1.0.2"
regex = "1"
async-smtp = "0.10.2"
lettre = { version = "0.11.19", default-features = false, features = ["builder"] }
tokio-native-tls = "0.3.1"
kuchikiki = "0.8.8-speedreader"
html5ever = "0.25"
markup5ever = "0.10"
once_cell = "1.21.3"
tiny-bip39 = "2.0.0"
futures = "0.3.31"
tokio-util = { version = "0.7.18", features = ["compat"] }
native-tls = "0.2.16"
imap-proto = "0.16.6"
encoding_rs = "0.8.35"

# Linux-specific deps
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["process", "user", "socket", "fs", "inotify"] }
tauri-plugin-notification = { version = "2.3.3" }
webkit2gtk = { version = "2.0", features = ["v2_32"] }

# Windows-specific deps
[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-notification = { version = "2.3.3", features = ["windows-version"] }
dunce = "1.0.5"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"

[dev-dependencies]
tempfile = "3"

[features]
default = ["tpm"]
tpm = ["tss-esapi"]
