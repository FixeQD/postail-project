name: Rust PR Check

on:
    pull_request:
        paths:
            - 'src-tauri/**'
            - 'Cargo.toml'
            - 'Cargo.lock'

jobs:
    test:
        name: Cargo Test
        runs-on: [self-hosted, Xeon]
        steps:
            - uses: actions/checkout@v4

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y pkg-config libglib2.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libtss2-dev

            - name: Install Rust
              run: rustup default stable

            - name: Run Tests
              working-directory: ./src-tauri
              run: cargo test
