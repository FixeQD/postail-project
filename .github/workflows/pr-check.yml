name: Rust PR Check

on:
    pull_request:
        paths:
            - 'src-tauri/**'
            - 'Cargo.toml'
            - 'Cargo.lock'

jobs:
    prepare:
        name: Power Management
        runs-on: ubuntu-latest
        outputs:
            runner_off: ${{ steps.check.outputs.runner_off }}
        steps:
            - name: Check server status
              id: check
              run: |
                  STATUS=$(curl -s -H "X-Auth-Token: ${{ secrets.RUNNER_POWER_TOKEN }}" ${{ secrets.RUNNER_POWER_URL }}/status)
                  echo "Current status: $STATUS"
                  if [ "$STATUS" == "false" ]; then
                    echo "Server is down. Sending power-on command..."
                    curl -X POST -H "X-Auth-Token: ${{ secrets.RUNNER_POWER_TOKEN }}" ${{ secrets.RUNNER_POWER_URL }}/on
                    echo "runner_off=true" >> $GITHUB_OUTPUT
                  else
                    echo "Server is already up."
                    echo "runner_off=false" >> $GITHUB_OUTPUT
                  fi

    test:
        name: Cargo Test
        needs: prepare
        runs-on: [self-hosted, Xeon]
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              run: rustup default stable

            - name: Run Tests
              working-directory: ./src-tauri
              run: cargo test

            - name: Schedule Shutdown
              if: always() && needs.prepare.outputs.runner_off == 'true'
              run: |
                  echo "Server was started by this PR. Scheduling shutdown in 5 minutes..."
                  sudo /usr/sbin/shutdown +5 &
                  sleep 2
